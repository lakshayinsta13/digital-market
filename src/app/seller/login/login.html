<div class="login-container">
  <div class="login-card">

    <!-- HEADER -->
    <h2>Seller Login</h2>
    <p class="subtitle">
      Welcome back! Please login to continue.
    </p>

    <!-- FORM -->
    <form (ngSubmit)="submitLogin()" novalidate>

      <!-- ========================= -->
      <!-- USERNAME -->
      <!-- ========================= -->
      <div class="form-group">
        <label>Username <span class="required">*</span></label>
        <input type="text" name="username" [(ngModel)]="loginData.username" placeholder="Enter your username"
          required />
      </div>

      <!-- ========================= -->
      <!-- PASSWORD -->
      <!-- ========================= -->
      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <input type="password" name="password" [(ngModel)]="loginData.password" placeholder="Enter your password"
          required />
      </div>

      <!-- ========================= -->
      <!-- ERROR MESSAGE -->
      <!-- ========================= -->
      <p class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <!-- ========================= -->
      <!-- LOGIN BUTTON -->
      <!-- ========================= -->
      <button type="submit" class="login-btn" [disabled]="
          !loginData.username ||
          !loginData.password ||
          isLoading
        ">
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading">Logging in...</span>
      </button>

    </form>

    <!-- ========================= -->
    <!-- EXTRA LINKS -->
    <!-- ========================= -->
    <div class="links">
      <p>
        Don’t have an account?
        <a routerLink="/seller/signup">Sign up</a>
      </p>
      <p>
        <a routerLink="/seller">← Back to Seller Dashboard</a>
      </p>
    </div>

  </div>
</div>
