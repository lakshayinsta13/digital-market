<h1>Seller Dashboard</h1>
<p>Login or signup to manage your shop.</p>

<div class="seller-cards">
  <!-- Login Card -->
  <div class="card">
    <h3>Login</h3>
    <p>Already have an account?</p>
    <button routerLink="/seller/login">Login</button>
  </div>

  <!-- Signup Card -->
  <div class="card">
    <h3>Signup</h3>
    <p>New seller? Register your shop.</p>
    <button routerLink="/seller/signup">Signup</button>
  </div>
</div>
